; Config for transcriptionCheck.py
; Standalone: no database, no email, no bucket. Paths are absolute or relative
; to this file's directory. Every setting can be overridden on the CLI.

[INPUT]
; File to check, or a folder — every .tsv/.csv/.txt/.xlsx inside it is checked,
; each one reported on its own sheet.
path =
; Search sub-folders too when path is a folder.
recursive = false
; --- the project-specific part: which columns hold what --------------------
; The checks themselves are project-agnostic; point them at your columns here.
; The values below suit a QC review export, where the reviewer types a corrected
; transcription only when the original did not match the audio. For a plain
; transcription batch this is usually text_column = transcription,
; language_column = language, and no condition.

; Column holding the transcription text to validate.
text_column = If not, please type the correct transcription.
; Column holding the language name (Gujarati, Hindi, ...). Drives the
; nonnative_charecters and native_script_mismatch checks; if the column is
; absent those two are skipped with a warning and everything else still runs.
language_column = Language
; Column used to identify a row in the findings sheet. Leave empty to report
; rows by line number alone.
key_column = File_Name
; Delimiter for text files. Use \t for tab.
sep = \t
; Optional gate: check a row only when condition_column does NOT equal
; condition_value — here, only rows the reviewer marked as NOT matching carry a
; correction worth validating. Blank out condition_column to check every row.
condition_column = Does the transcribed text exactly match the audio?
condition_value = yes
; Skip rows whose text is blank rather than reporting every one of them as
; empty. Turn off to check blanks too.
skip_blank_rows = true
; Extra cell values treated as blank, on top of '' and whitespace-only.
; Case-insensitive. Leave empty to treat only true blanks as blank.
blank_values = nan, none, null, na

[OUTPUT]
; Where the xlsx report is written. Relative paths resolve against this file.
dir = results

[CONTENT_CHECKS]
; Minimum words before number_of_words_lt_threshold fires.
check_words_limit = 3
; Share of a line that may be tag text before invalid_* fires.
invalid_sentence_from_tags_ratio = 0.5
; Percent of checked rows allowed to carry a content error before the single
; batch-level error is raised. 0.0 means any content error trips it.
batch_minimum_rejected_threshold = 00.0

[CHECKS]
; Toggle individual checks. Anything not listed defaults to true.
transcript_is_empty                = true
number_of_words_lt_threshold       = false
transcript_has_numbers             = true
brackets_dont_have_open_close      = true
bracket_structure_invalid          = true
consecutive_duplicate_tag          = true
tag_spacing_missing                = true
script_inconsistency               = true
inaudible                          = true
unintelligible                     = true
PAUSE                              = true
UNKNOWN_SEGMENT                    = false
invalid_audible_unintelligible     = false
invalid_UNKNOWN_SEGMENT            = false
nonnative_charecters               = true
native_script_mismatch             = true
batch_minimum_acceptance           = true
